[package]
name = "solana-wallet-drainer"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-program = "~1.18"
spl-token = { version = "~5", features = ["no-entrypoint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
